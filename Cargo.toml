[workspace]
members = [
  "crates/kheish-agent",
  "crates/kheish-auth",
  "crates/kheish-coding-tools",
  "crates/kheish-codec",
  "crates/kheish-core",
  "crates/kheish-daemon",
  "crates/kheish-harness",
  "crates/kheish-mcp",
  "crates/kheish-output",
  "crates/kheish-runtime",
  "crates/kheish-skills",
  "crates/kheish-session",
  "crates/kheish-types",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
aes-gcm-siv = "0.11.1"
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = "0.8.6"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = "0.10.4"
cron = "0.15.0"
ed25519-dalek = "2.2.0"
futures-core = "0.3.31"
futures-util = "0.3.31"
hmac = "0.12.1"
hex = "0.4.3"
httpdate = "1.0.3"
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rmcp = { version = "1.3.0", default-features = false, features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rand = "0.8.5"
lopdf = "0.35.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
subtle = "2.6.1"
tempfile = "3.20.0"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tokio-util = "0.7.16"
toml = "0.8.23"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json", "time"] }
