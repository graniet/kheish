<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kheish Console</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0b0d10;
        color: #e6e9ee;
      }
      main {
        max-width: 34rem;
        padding: 2.5rem 2rem;
        text-align: center;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0.4rem 0;
        line-height: 1.5;
        color: #a7b0bd;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #171a1f;
        border: 1px solid #262b33;
        border-radius: 6px;
        padding: 0.15rem 0.4rem;
        color: #e6e9ee;
      }
      a {
        color: #6ea8fe;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Console bundle missing</h1>
      <p>
        This daemon is serving the placeholder console shell. Build the real
        console bundle with:
      </p>
      <p><code>scripts/bundle-console.sh</code></p>
      <p>
        The daemon control-plane API is still fully available under
        <code>/v1</code>.
      </p>
    </main>
  </body>
</html>
