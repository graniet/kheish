# Kheish reverse-proxy fixture for production-like deployments.
#
# This file is intentionally conservative:
# - TLS terminates at Nginx.
# - The daemon remains on loopback.
# - Bearer auth is preserved end-to-end.
# - SSE response buffering is disabled.
# - CORS is left to the daemon or same-origin gateway policy.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream kheish_daemon {
        server 127.0.0.1:4000;
        keepalive 16;
    }

    server {
        listen 8443 ssl http2;
        server_name kheish.example.com;

        ssl_certificate /etc/kheish/tls/fullchain.pem;
        ssl_certificate_key /etc/kheish/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 32m;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass_request_headers on;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering no always;

        location / {
            proxy_pass http://kheish_daemon;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
}
