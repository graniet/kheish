apiVersion: kheish.ai/v1alpha1
kind: KheishStack
metadata:
  name: linear-github-feature-loop
  labels:
    example: linear-github-feature-loop
spec:
  apply:
    strict_scopes: true
    restart_policy: plan_only
  requires:
    secrets:
      - ref: mcp.linear.LINEAR_API_KEY
        provider: generic
        value_env: LINEAR_API_KEY
      - ref: mcp.github.GITHUB_PERSONAL_ACCESS_TOKEN
        provider: generic
        value_env: GITHUB_PERSONAL_ACCESS_TOKEN
    mcp:
      servers:
        - name: github
          source: codex_config
          uses_credentials: true
          credential_secret_refs: ["mcp.github.GITHUB_PERSONAL_ACCESS_TOKEN"]
        - name: linear
          source: built_in_catalog
          catalog_entry_id: linear
          uses_credentials: true
          credential_secret_refs: ["mcp.linear.LINEAR_API_KEY"]
      tools:
        - mcp__github__get_me
        - mcp__github__search_code
        - mcp__github__search_pull_requests
        - mcp__github__get_file_contents
        - mcp__github__list_branches
        - mcp__github__create_branch
        - mcp__github__create_or_update_file
        - mcp__github__push_files
        - mcp__github__create_pull_request
        - mcp__github__update_pull_request
        - mcp__github__list_pull_requests
        - mcp__github__pull_request_read
        - mcp__github__add_reply_to_pull_request_comment
        - mcp__github__add_issue_comment
        - mcp__linear__get_issue
        - mcp__linear__list_comments
        - mcp__linear__list_issues
        - mcp__linear__list_issue_statuses
        - mcp__linear__list_projects
        - mcp__linear__list_teams
        - mcp__linear__save_comment
        - mcp__linear__save_issue
  personas:
    - persona_id: feature-pr-operator-v013
      display_name: Feature PR Operator
      soul_file: persona.md
      capability_scope:
        skill_allow: ["notify_operator", "ask_operator"]
        mcp_server_allow: ["github", "linear"]
        mcp_tool_allow:
          - mcp__github__get_me
          - mcp__github__search_code
          - mcp__github__search_pull_requests
          - mcp__github__get_file_contents
          - mcp__github__list_branches
          - mcp__github__create_branch
          - mcp__github__create_or_update_file
          - mcp__github__push_files
          - mcp__github__create_pull_request
          - mcp__github__update_pull_request
          - mcp__github__list_pull_requests
          - mcp__github__pull_request_read
          - mcp__github__add_reply_to_pull_request_comment
          - mcp__github__add_issue_comment
          - mcp__linear__get_issue
          - mcp__linear__list_comments
          - mcp__linear__list_issues
          - mcp__linear__list_issue_statuses
          - mcp__linear__list_projects
          - mcp__linear__list_teams
          - mcp__linear__save_comment
          - mcp__linear__save_issue
  sessions:
    - session_id: feature-pr-loop-v015
      persona_id: feature-pr-operator-v013
      capability_scope:
        skill_allow: ["notify_operator", "ask_operator"]
        mcp_server_allow: ["github", "linear"]
        mcp_tool_allow:
          - mcp__github__get_me
          - mcp__github__search_code
          - mcp__github__search_pull_requests
          - mcp__github__get_file_contents
          - mcp__github__list_branches
          - mcp__github__create_branch
          - mcp__github__create_or_update_file
          - mcp__github__push_files
          - mcp__github__create_pull_request
          - mcp__github__update_pull_request
          - mcp__github__list_pull_requests
          - mcp__github__pull_request_read
          - mcp__github__add_reply_to_pull_request_comment
          - mcp__github__add_issue_comment
          - mcp__linear__get_issue
          - mcp__linear__list_comments
          - mcp__linear__list_issues
          - mcp__linear__list_issue_statuses
          - mcp__linear__list_projects
          - mcp__linear__list_teams
          - mcp__linear__save_comment
          - mcp__linear__save_issue
      credential_scope:
        route_allow: ["openai"]
        connector_allow: ["feature-loop-operator-telegram"]
        connector_credential_allow: ["feature-loop-operator-telegram:bot_token"]
        mcp_server_allow: ["github", "linear"]
      route_policy:
        provider: openai
        generation:
          model: gpt-5.5
          max_output_tokens: 6000
          reasoning:
            effort: medium
      reply_targets:
        - type: telegram
          connector: feature-loop-operator-telegram
          chat_id: 123456789
      operator:
        enabled: true
        display_name: Project operator
        communication_style: concise and human
        allow_notify: true
        allow_questions: true
  playbooks:
    - manifest_file: playbook.yaml
      publish:
        status: active
        evidence_refs:
          - kind: manual
            id: stack-example-reviewed
            description: Example reviewed before publication.
  schedules:
    - name: linear-intake-0800-v024
      target_session_id: feature-pr-loop-v015
      cadence:
        type: cron
        expression: "0 0 8 * * *"
        timezone: Europe/Paris
      overlap_policy: skip
      misfire_policy:
        type: coalesce_once
      flow_start:
        playbook_ref:
          playbook_id: linear-github-feature-pr-loop
          version: "0.1.14"
        request:
          provider: openai
          content_file: intake.md
          generation:
            model: gpt-5.5
            max_output_tokens: 6000
            reasoning:
              effort: medium
        metadata:
          workflow: linear-intake
          project: ExampleProject
          linear_team_key: ENG
          repository: example-org/example-app
          max_tickets: 1
          goal_token_budget: 600000
          max_goal_attempts: 6
          max_no_progress: 2
    - name: github-review-followup-30m-v026
      target_session_id: feature-pr-loop-v015
      cadence:
        type: cron
        expression: "0 15,45 * * * *"
        timezone: Europe/Paris
      overlap_policy: skip
      misfire_policy:
        type: coalesce_once
      flow_start:
        playbook_ref:
          playbook_id: linear-github-feature-pr-loop
          version: "0.1.14"
        request:
          provider: openai
          content_file: review-followup.md
          generation:
            model: gpt-5.5
            max_output_tokens: 6000
            reasoning:
              effort: medium
        metadata:
          workflow: github-review-followup
          project: ExampleProject
          linear_team_key: ENG
          repository: example-org/example-app
          goal_token_budget: 600000
          max_goal_attempts: 6
          max_no_progress: 2
  verification:
    - name: persona
      type: persona_exists
      persona_id: feature-pr-operator-v013
    - name: session
      type: session_exists
      session_id: feature-pr-loop-v015
    - name: intake-schedule
      type: schedule_exists
      schedule_name: linear-intake-0800-v024
    - name: followup-schedule
      type: schedule_exists
      schedule_name: github-review-followup-30m-v026
    - name: playbook
      type: playbook_version_exists
      playbook_id: linear-github-feature-pr-loop
      version: "0.1.14"
